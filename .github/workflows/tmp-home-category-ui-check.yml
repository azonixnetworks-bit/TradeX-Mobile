name: Temporary Home Category UI Validation
on:
  push:
    branches: [ui/compact-white-market-category-cards-20261108]
    paths:
      - '.github/workflows/tmp-home-category-ui-check.yml'
      - 'lib/features/home/presentation/home_dashboard/latest_content_section.dart'
      - 'test/home_market_overview_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze UI changes
        run: flutter analyze --no-pub lib/features/home/presentation/home_dashboard/latest_content_section.dart test/home_market_overview_test.dart
      - name: Run Home Dashboard widget regression tests
        run: flutter test --no-pub test/home_market_overview_test.dart
