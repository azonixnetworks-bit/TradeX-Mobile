name: Temporary Compact Session UI Validation
on:
  push:
    branches:
      - ui/compact-white-session-cards-20261108
    paths:
      - '.github/workflows/tmp-session-cards-validate.yml'
      - 'lib/features/home/presentation/home_dashboard/market_clock_section.dart'
      - 'test/home_market_overview_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-widget-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze changed Flutter files
        run: flutter analyze --no-pub lib/features/home/presentation/home_dashboard/market_clock_section.dart test/home_market_overview_test.dart
      - name: Test home market clock behavior and compact cards
        run: flutter test --no-pub test/home_market_overview_test.dart
