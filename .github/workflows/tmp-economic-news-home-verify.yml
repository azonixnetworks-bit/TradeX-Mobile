name: Temporary Economic News Home UI Verification

on:
  push:
    branches:
      - ui/home-economic-news-high-impact-alert-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze updated presentation and regression tests
        run: |
          flutter analyze --no-pub \
            lib/features/home/presentation/home_dashboard_screen.dart \
            lib/features/home/presentation/widgets/home_high_impact_news_preview.dart \
            lib/shared/widgets/no_trade_zone_warning.dart \
            test/home_high_impact_news_alert_test.dart
      - name: Test backend news mapping, high impact, no trade and home dashboard
        run: |
          flutter test --no-pub \
            test/home_high_impact_news_alert_test.dart \
            test/no_trade_zone_warning_test.dart \
            test/market_news_repository_test.dart \
            test/economic_news_screen_test.dart \
            test/home_market_overview_test.dart
