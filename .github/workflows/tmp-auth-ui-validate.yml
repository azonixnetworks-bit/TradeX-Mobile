name: Temporary Auth UI Validation
on:
  push:
    branches:
      - ui/register-centered-dark-text-20261108
    paths:
      - '.github/workflows/tmp-auth-ui-validate.yml'
      - 'lib/features/auth/presentation/register_screen.dart'
      - 'lib/features/auth/presentation/widgets/auth_form_components.dart'
      - 'test/register_wave_keyboard_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out target commit
        uses: actions/checkout@v4
      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze auth UI
        run: flutter analyze --no-pub lib/features/auth/presentation/register_screen.dart lib/features/auth/presentation/widgets/auth_form_components.dart
      - name: Run authentication widget and model tests
        run: flutter test --no-pub test/auth_recovery_ui_test.dart test/auth_models_test.dart test/widget_test.dart test/register_wave_keyboard_test.dart
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
