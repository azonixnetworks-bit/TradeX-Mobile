name: tradex_mobile
description: "TradeX premium mobile application for Android and iOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.3
  flutter_secure_storage: ^11.2.0
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  uuid: ^4.6.0
  go_router: ^18.0.2
  qr_flutter: ^4.1.0
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
