name: tradex_mobile
description: "TradeX premium mobile application for Android and iOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.3
  flutter_secure_storage: ^11.2.0
  local_auth: ^2.3.0
  crypto: ^3.0.6
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  uuid: ^4.6.0
  go_router: ^18.0.2
  qr_flutter: ^4.1.0
  flutter_timezone: ^5.1.0
  url_launcher: ^6.3.2
  timezone: ^0.11.2
  image_picker: ^1.1.2
  path_provider: ^2.1.6
  video_player: ^2.14.1
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1
  flutter_svg: ^2.3.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/auth_ui/shared/
    - assets/auth_ui/splash/
    - assets/auth_ui/welcome/
    - assets/security_ui/
    - assets/auth_recovery_ui/
    - assets/recovery_course_ui/
    - assets/language_chart_screener_ui/
    - assets/home_ui/complex_png/
    - assets/home_ui/simple_svg/
    - assets/learning_ui/illustrations_png/
    - assets/learning_ui/decorations_png/
    - assets/learning_ui/icons_svg/
    - assets/progress_ai_premium_ui/illustrations/
    - assets/crypto_market/cards/
    - assets/market_sessions/
    - assets/market_assets/flags/
    - assets/market_assets/crypto/
    - assets/market_assets/instruments/
    - assets/affiliate/
    - assets/affiliate/illustrations/
    - assets/affiliate/brands/
    - assets/affiliate/referral/
    - assets/affiliate/dynamic_v2/
    - assets/support/images/
    - assets/support/icons/
    - assets/risk_reward/
    - assets/replay_terminal/
